name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create fallback .env if missing
      run: |
        if [ ! -f ".env" ]; then
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "debug.keystore.base64 not found, typical debug build might complain but we'll try"
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          mv app/build/outputs/apk/debug/app-debug.apk med-prep.apk
        else
          echo "Expected APK path not found! Searching dynamically..."
          find app/build/outputs -name "*.apk" -print
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" med-prep.apk
            echo "Successfully found and copied $APK_PATH to med-prep.apk"
          else
            echo "No APK was found anywhere in app/build/outputs!"
            exit 1
          fi
        fi

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MedPrep-App
        path: med-prep.apk
        
    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: latest
        name: MED-PREP Latest Release
        files: med-prep.apk
        prerelease: true
