name: Android Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create fallback .env if missing
      run: |
        if [ ! -f ".env" ]; then
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare APK and ZIP Artifacts
      run: |
        mkdir -p dist
        APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/app-debug.apk
          cp "$APK_PATH" dist/medprep-app.apk
          cd dist && zip -r medprep-app-apk.zip app-debug.apk medprep-app.apk && cd ..
        else
          echo "Error: No APK built!"
          exit 1
        fi

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MedPrep-APK-Build
        path: |
          dist/app-debug.apk
          dist/medprep-app.apk
          dist/medprep-app-apk.zip

    - name: Publish GitHub Release with APK & ZIP
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v1.0.0
        name: "MedPrep Android Release (v1.0.0)"
        body: |
          ### MedPrep Android Build
          
          Download the ready-to-install APK directly to your phone or tablet:
          - **[app-debug.apk](dist/app-debug.apk)**
          - **[medprep-app.apk](dist/medprep-app.apk)**
          - **[medprep-app-apk.zip](dist/medprep-app-apk.zip)**
        files: |
          dist/app-debug.apk
          dist/medprep-app.apk
          dist/medprep-app-apk.zip
        draft: false
        prerelease: false
